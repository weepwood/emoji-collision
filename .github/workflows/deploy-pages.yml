name: 测试并部署 GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 测试与构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装依赖
        run: npm install --no-audit --no-fund
      - name: 运行测试
        run: npm run test
      - name: 构建站点
        run: npm run build
      - name: 验证已发布站点
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          for attempt in {1..18}; do
            echo "第 ${attempt} 次检查线上站点"
            page="$(curl --fail --silent --show-error --location --max-time 15 https://weepwood.github.io/emoji-collision/ || true)"
            if grep -q '<title>Emoji Collision Lab</title>' <<< "$page"; then
              echo "GitHub Pages 已正常发布"
              exit 0
            fi
            sleep 5
          done
          echo "::error::GitHub Pages 地址未返回预期页面"
          exit 1
      - name: 配置 GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: 上传 Pages 构建产物
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: 发布 GitHub Pages
    if: github.event_name != 'pull_request'
    needs: quality
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
