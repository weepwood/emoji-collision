name: 测试并部署 GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 测试与构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装依赖
        run: npm install --no-audit --no-fund
      - name: 运行测试
        run: npm run test
      - name: 构建站点
        run: npm run build
      - name: 检查 GitHub Pages 配置
        uses: actions/configure-pages@v5
      - name: 验证线上站点
        if: github.event_name == 'pull_request'
        run: curl --fail --silent --show-error --location --retry 4 --retry-delay 3 https://weepwood.github.io/emoji-collision/ | grep -F "Emoji Collision Lab"
      - name: 上传 Pages 构建产物
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: 发布 GitHub Pages
    if: github.event_name != 'pull_request'
    needs: quality
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
