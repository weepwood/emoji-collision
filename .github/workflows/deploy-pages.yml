name: 测试并部署 GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# PR 校验与 main 部署必须使用不同的并发组。
# 否则新的 PR 工作流会取消正在进行的 Pages 正式发布。
concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 测试与构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装依赖
        run: npm install --no-audit --no-fund
      - name: 运行测试
        run: npm run test
      - name: 构建站点
        run: npm run build
      - name: 验证底部安全区已上线
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            html="$(curl -fsSL https://weepwood.github.io/emoji-collision/)"
            css_path="$(printf '%s' "$html" | grep -oE '/emoji-collision/assets/[^" ]+\.css' | head -n 1 || true)"
            if [[ -n "$css_path" ]] && curl -fsSL "https://weepwood.github.io${css_path}" | grep -q -- '--dock-safe-zone'; then
              echo "线上样式已包含底部安全区规则。"
              exit 0
            fi
            echo "等待正式 Pages 更新（${attempt}/12）"
            sleep 10
          done
          echo "未在正式 Pages 样式中检测到底部安全区规则。"
          exit 1
      - name: 配置 GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: 上传 Pages 构建产物
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: 发布 GitHub Pages
    if: github.event_name != 'pull_request'
    needs: quality
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
